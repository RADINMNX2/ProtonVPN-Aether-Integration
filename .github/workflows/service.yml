name: Service (.NET)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/service.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/service.yml'
  workflow_dispatch:

jobs:
  build-core:
    name: Build service-side subset (no-account + Aether C#)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore + build changed C# projects (failures surface)
        shell: pwsh
        working-directory: src
        run: |
          $projects = @(
            "Common/ProtonVPN.Common.Core/ProtonVPN.Common.Core.csproj"
            "Configurations/ProtonVPN.Configurations.Contracts/ProtonVPN.Configurations.Contracts.csproj"
            "Configurations/ProtonVPN.Configurations/ProtonVPN.Configurations.csproj"
            "ProtonVPN.Vpn/ProtonVPN.Vpn.csproj"
            "ProtonVPN.Service/ProtonVPN.Service.csproj"
            "Client/Logic/Auth/ProtonVPN.Client.Logic.Auth/ProtonVPN.Client.Logic.Auth.csproj"
            "Client/Logic/Auth/ProtonVPN.Client.Logic.Auth.Installers/ProtonVPN.Client.Logic.Auth.Installers.csproj"
          )
          $failed = $false
          foreach ($p in $projects) {
            Write-Host "==== building $p ===="
            dotnet build $p -c Debug
            if ($LASTEXITCODE -ne 0) { $failed = $true; Write-Host "::error::build failed: $p" }
          }
          if ($failed) { exit 1 }

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-bin
          path: |
            src/**/bin/Debug/**/*
          if-no-files-found: warn
