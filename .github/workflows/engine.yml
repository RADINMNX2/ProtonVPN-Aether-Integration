name: Engine (Rust)

on:
  push:
    branches: [main]
    paths:
      - 'aether/**'
      - 'CORE_VERSION'
      - 'scripts/**'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'aether/**'
      - 'CORE_VERSION'
      - 'scripts/**'
      - '.github/workflows/engine.yml'
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Aether engine (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned core version
        id: ver
        shell: bash
        run: echo "v=$(cat CORE_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aether/aether
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        continue-on-error: true
        working-directory: aether/aether
        run: cargo fmt --all -- --check

      # boring-sys compiles BoringSSL via the `cmake` crate. The default MSBuild
      # generator fails on CI with MSVC FileTracker FTK1011 (cvtres .tlog path).
      # Forcing the Ninja generator (read by the cmake crate from CMAKE_GENERATOR)
      # avoids the MSBuild tracker entirely. Ninja + cl need the MSVC dev env.
      - name: Set up MSVC (Ninja + cl)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build engine (aether.exe, static CRT)
        timeout-minutes: 40
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          set -euo pipefail
          command -v ninja && ninja --version
          cargo build --release --locked --target x86_64-pc-windows-msvc \
            --manifest-path aether/aether/Cargo.toml \
            || cargo build --release --target x86_64-pc-windows-msvc \
               --manifest-path aether/aether/Cargo.toml
          ls -la aether/aether/target/x86_64-pc-windows-msvc/release/aether.exe

      - name: Stage engine payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-engine
          cp aether/aether/target/x86_64-pc-windows-msvc/release/aether.exe dist-engine/
          cp CORE_VERSION dist-engine/CORE_VERSION
          ./scripts/fetch-wintun.ps1 -ArchDir bin/amd64 -WintunVersion 0.14.1
          ls -la dist-engine

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-engine-x64
          path: dist-engine/
          if-no-files-found: error

  validate:
    name: Clippy (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aether/aether
      - name: Clippy
        continue-on-error: true
        working-directory: aether/aether
        run: cargo clippy --all-targets -- -D warnings
